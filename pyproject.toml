[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brikia"
version = "0.1.0"
description = "BrikIA - pilotage local de la ligne de production de briques (phase 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pypdf>=5"]
# Lecture réelle des plans (phase 2). Optionnel : sans lui, BrikIA reste pleinement
# fonctionnel mais l'analyse est simulée (et signalée comme telle).
phase2 = [
    "ifcopenshell>=0.8",   # IFC
    "ezdxf>=1.3",          # DXF
    "cadquery-ocp>=7.7",   # STEP (Open CASCADE ; pythonOCC n'existe que sous conda)
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
brikia = ["static/**/*", "web/templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
